    <body>
        <main>
            
            <section>
                <div class="row">

                <form id="finance-form">

                        <div class="col-sm-5 row inputs">
                            <div class="col-6">
                                <input type="text" id="first_name" name="whole_name" class="form-input"><br>
                                <label for="first_name"><small>First</small></label>

                            <div class="col-6">
                                <input type="text" id="last_name" name="whole_name" class="form-input"><br>
                                <label for="last_name"><small>Last</small></label>
                            </div> 
                        </div>
                        <div class="col-sm-4 error-message" hidden="" id="whole_name-error"></div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3 labels">
                            <label for="govId">State Issue ID:</label>
                        </div>
                        <div class="col-sm-5 inputs center">
                            <input type="file" accept="image/*" id="govId" name="govId" class="image-input">
                        </div>
                        <div class="col-sm-4"></div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3 labels my-auto"><label>University ID: </label></div>
                        <div class="col-sm-5 inputs">
                            <input type="number" id="uni_id" name="uni_id" class="form-input">
                        </div>
                        <div class="col-sm-4 error-message" hidden="" id="uni_id-error"></div>
                    </div>
                    <!--
                        Add input for subcategories 
                            -> Resource
                            -> Frequency
                            -> Amount
                            ?-> Use by percentage
                    -->
                    <div class="row">
                        <div class="col-sm-3 labels my-auto"><label for="income_streams-amount">Total Income Streams:&nbsp;</label></div>
                        <div class="col-sm-5 inputs">
                            <input type="number" id="income_streams-amount">
                        </div>
                        <div class="col-sm-4 error-message" hidden="" id="income_streams-error"></div>
                    </div>
                    <div class="row" hidden id="income_streams-heads">
                        <div class="col-sm-3" ><h5>Resource</h5></div>
                        <div class="col-sm-3" ><h5>Frequency</h5></div>
                        <div class="col-sm-3" ><h5>Amount</h5></div>
                        <div class="col-sm-3" ><h5>Usage(%)</h5></div>
                    </div>
                    <div class="row" id="income_streams">
                        <div class="col-sm-3" id="resources"></div>
                        <div class="col-sm-3" id="frequency"></div>
                        <div class="col-sm-3" id="amounts"></div>
                        <div class="col-sm-3" id="uses"></div>
                    </div>
                    <!--
                        Add input for subcategories 
                            -> Institution
                            -> Account Type
                            ?-> Acc # (last 4)
                            ?-> Purpose
                    -->
                    <div class="row">
                        <div class="col-sm-3 labels my-auto"><label for="financial_accounts-amount">Total Financial Accounts:&nbsp;</label></div>
                        <div class="col-sm-5 inputs">
                            <input type="number" id="financial_accounts-amount">
                        </div>
                        <div class="col-sm-4 error-message" hidden="" id="financial_accounts-error"></div>
                    </div>
                    <div class="row" hidden id="financial_accounts-heads">
                        <div class="col-sm-3" ><h5>Institution</h5></div>
                        <div class="col-sm-3" ><h5>Type</h5></div>
                        <div class="col-sm-3" ><h5>Account #</h5></div>
                        <div class="col-sm-3" ><h5>Purpose</h5></div>
                    </div>
                    <div class="row" id="financial_accounts">
                        <div class="col-sm-3" id="institution"></div>
                        <div class="col-sm-3" id="account_types"></div>
                        <div class="col-sm-3" id="account_numbers"></div>
                        <div class="col-sm-3" id="purposes"></div>
                    </div>
                    <!--
                        Eventually calculate actual value based on 2 weeks expenses 
                            -> Based on fixed nationwide average || Based on user's estimated weekly spending
                            ?-> By average of attended uni's local cost of living
                            ?-> Flight or roadtrip home included
                    -->
                    <div class="row">
                        <div class="col-sm-3 labels my-auto"><label>Estimate Needed Emergency Cash: </label></div>
                        <div class="col-sm-5 inputs">
                            <input type="number" step="0.01" id="emergency_cash_guess" name="emergency_cash_guess" class="form-input">
                        </div>
                        <div class="col-sm-4 error-message" hidden="" id="emergency_cash_guess-error"></div>
                    </div>
                    <!--
                        Eventually savings needed to meet goal based on time until graduation 
                            -> Based on emergency cash needed, loans, future needs
                            ?-> By using attended uni's state average info && By using estimated rate of inflation
                    -->
                    <div class="row">
                        <div class="col-sm-3 labels my-auto"><label>Estimate Needed Monthly Saving: </label></div>
                        <div class="col-sm-5 inputs">
                            <input type="number" step="0.01" id="monthly_saving_guess" name="monthly_saving_guess" class="form-input">
                        </div>
                        <div class="col-sm-4 error-message" hidden="" id="monthly_saving_guess-error"></div>
                    </div>
                    <!--
                        Add input for generating monthly expense report: 
                            -> Importance (1-5)
                            -> Amount
                            ?-> Date
                            ?-> Expense
                    -->

                        <div class="col-sm-3 labels"></div>
                        <!-div class="col-sm-5"><button type="submit">Save Changes</button></div>
                        <div class="col-sm-5 inputs"><input type="button" name="save" value="Save Changes" onclick="listInputs(this.form)"/></div>
                        <!-div class="col-sm-5"><input type="submit" value="Save Changes"/></div>
                        <div class="col-sm-4"></div>
                    </div-->
                    
                
                
                <!--form id="data-form"-->
                    <div class="row">
                        <div class="col-sm-3 labels my-auto"><label for="passkey">Passkey: </label></div>
                        <div class="col-sm-5">
                            <input type="password" id="passkey" name="passkey" class="data-input">
                        </div>
                        <div class="col-sm-4 error-message my-auto" hidden="" id="passkey-error"><a class="error-text mx-auto">Passkey must be 8+ characters.</a></div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-5 labels center">
                            <label for="encrypted_file" class="file-upload">Upload Encrypted</label>
                            <input type="file" accept=".json" id="encrypted_file" name="encrypted_file" class="data-input">
                        </div>
                        <div class="col-sm-4"></div>
                    </div>
                    <div class="row">
                        <div class="col-sm-3"></div>
                        <div class="col-sm-5 center"><button onclick="downloadFile();return false;">New Download</button></div>
                        <div class="col-sm-4"></div>
                    </div>
                </form>
            </section>
            <section>
                <div id="display" class="overflow"></div>
            </section>
        </main>
        <script>
            /*Using either IndexedDB or Cache api 
                ->Create storage model to save clustered datasets for later retrieval
                ->Generate:
                    Table - Expense Report, Financial Institutions, Income Streams
                    D3 Viz - Estimate Vs Actual Emergency Cash, Saving Needed to Reach Goal
            */ 
            const incomeHeads = document.getElementById('income_streams-heads');
            const incomeTable = document.getElementById('income_streams');
            const incomeAmount = document.getElementById('income_streams-amount');
            const accountHeads = document.getElementById('financial_accounts-heads');
            const accountTable = document.getElementById('financial_accounts');
            const accountAmount = document.getElementById('financial_accounts-amount');
            const divNode = document.createElement('div');
            const inputNode = document.createElement('input');
            const display = document.getElementById('display');
            const passkeyInput = document.getElementById('passkey');
            const passkeyError = document.getElementById('passkey-error');
            const finForm = document.forms[0];
            const dataForm = document.forms[1];
            const encoder = new TextEncoder('utf-8');
            const decoder = new TextDecoder('utf-8');
            const imgReader = new FileReader();




            function updateIncomeStreams(){
                for(x=incomeTable.firstElementChild.children.length+1;x<=incomeAmount.value;x++){
                    incomeRow();
                }
                for(i=incomeTable.firstElementChild.children.length;i > incomeAmount.value;i--){
                    for(element of incomeTable.children){
                        element.lastChild.remove();
                    }
                }
                if(incomeTable.firstElementChild.children.length <= 0){
                    incomeHeads.hidden = true;
                }else{
                    incomeHeads.hidden = false;
                }
            }
            function updateFinancialAccounts(){
                for(x=accountTable.firstElementChild.children.length+1;x<=accountAmount.value;x++){
                    accountRow();
                }
                for(i=accountTable.firstElementChild.children.length;i > accountAmount.value;i--){
                    for(element of accountTable.children){
                        element.lastChild.remove();
                    }
                }
                if(accountTable.firstElementChild.children.length <= 0){
                    accountHeads.hidden = true;
                }else{
                    accountHeads.hidden = false;
                }
            }
            incomeAmount.addEventListener('change', (event)=>{
                updateIncomeStreams();
            });

            function incomeRow(action){
                const col = incomeTable.children[0];
                const col1 = incomeTable.children[1];
                const col2 = incomeTable.children[2];
                const col3 = incomeTable.children[3];

                    const resource = inputNode.cloneNode(true);
                        resource.setAttribute('type', 'text');
                        resource.setAttribute('class', 'income_resource-input');
                        col.appendChild(resource.cloneNode(true));
                    const frequency = resource.cloneNode(true);
                        frequency.setAttribute('class', 'income_frequency-input');
                        col1.appendChild(frequency.cloneNode(true));
                    const dollar = resource.cloneNode(true);
                        dollar.setAttribute('type', 'number');
                        dollar.setAttribute('step', '0.01');
                        dollar.setAttribute('class', 'income_amounts-input');
                        col2.appendChild(dollar.cloneNode(true));
                    const percentage = document.createElement('textarea');
                        percentage.setAttribute('class', 'income_usage-input')
                        col3.appendChild(percentage.cloneNode(true));
                
            }
            accountAmount.addEventListener('change', (event)=>{
                updateFinancialAccounts();
            });

            function accountRow(action){
                const col = accountTable.children[0];
                const col1 = accountTable.children[1];
                const col2 = accountTable.children[2];
                const col3 = accountTable.children[3];
                    const institution = inputNode.cloneNode(true);
                        institution.setAttribute('type', 'text');
                        institution.setAttribute('class', 'account_institution-input');
                        col.appendChild(institution.cloneNode(true));
                    const account_type = institution.cloneNode(true);
                        account_type.setAttribute('class', 'account_types-input');
                        col1.appendChild(account_type.cloneNode(true));
                    const account_number = account_type.cloneNode(true);
                        account_number.setAttribute('type', 'number');
                        account_number.setAttribute('class', 'account_numbers-input');
                        col2.appendChild(account_number.cloneNode(true));
                    const purpose = document.createElement('textarea');
                        purpose.setAttribute('class', 'account_purposes-input')
                        col3.appendChild(purpose.cloneNode(true));
            }
            const createTable = async (json, target) => {
                let displayTable = '<table>';
                if(typeof json.data[0] !== 'undefined'){
                    //console.log(json.data[0]);
                    const entries = Object.entries(json.data[0]);
                    const labels = [],
                    values = [];
                    for(entry of entries){
                        const name = entry[0];
                        const val = entry[0];
                        const words = name.split('_');
                        //console.log(words);
                        const labelCapitalized = words.map(word => word.replace(word.at(0), word.at(0).toUpperCase()));
                        //console.log(labelArr);
                        const labelString = labelCapitalized.join(' ');
                        //console.log(labelString);
                        labels.push(labelString);
                        values.push(val);
                    }
                    displayTable += '<thead><tr>';
                    for(label of labels){
                        displayTable += '<th >'+label+'</th>';
                    }
                    displayTable += '</tr>' +
                    '</thead>' +
                    '<tbody>';
                    for (row of json.data) {
                        const data = Object.entries(row);
                        let y = 0;
                        displayTable += '<tr>';
                            for(val of values){
                                //console.log(y);
                                //console.log(data[y][1]);
                                if(y < data.length){
                                    displayTable += '<td>' + data[y][1] + '</td>';
                                }  
                                y++;
                            }
                        displayTable += '</tr>';
                    }
                }else {
                     displayTable += '<thead>' +
                        '<tr></tr>' +
                        '</thead>'+
                        '<tbody>'
                }
                    displayTable += '</tbody></table>';
                    //console.log(displayTable);
                    target.innerHTML = displayTable;
            }

            function listInputs(json){
                if(typeof json.data !== 'undefined'){
                    const data = json.data[0];
                    finForm.first_name.value = data.first_name;
                    finForm.last_name.value = data.last_name;
                    finForm.uni_id.value = data.uni_id;
                    finForm.emergency_cash_guess.value = data.emergency_cash_guess;
                    finForm.monthly_saving_guess.value = data.monthly_saving_guess;
                    incomeAmount.value = data.resources.length;
                    updateIncomeStreams();
                    const resourceInputs = document.querySelectorAll('.income_resource-input');
                    const frequencyInputs = document.querySelectorAll('.income_frequency-input');
                    const amountsInputs = document.querySelectorAll('.income_amounts-input');
                    const usageInputs = document.querySelectorAll('.income_usage-input');
                    for(const [index, resource] of data.resources.entries()){
                        resourceInputs[index].value = resource;                        
                    }
                    for(const [index, resource] of data.frequency.entries()){
                        frequencyInputs[index].value = resource;                        
                    }
                    for(const [index, resource] of data.amounts.entries()){
                        amountsInputs[index].value = resource;                        
                    }
                    for(const [index, resource] of data.uses.entries()){
                        usageInputs[index].value = resource;                        
                    }
                    accountAmount.value = data.institution.length;
                    updateFinancialAccounts();
                    const institutionInputs = document.querySelectorAll('.account_institution-input');
                    const purposesInputs = document.querySelectorAll('.account_purposes-input');
                    const numbersInputs = document.querySelectorAll('.account_numbers-input');
                    const typesInputs = document.querySelectorAll('.account_types-input');
                    for(const [index, resource] of data.institution.entries()){
                        institutionInputs[index].value = resource;                        
                    }
                    for(const [index, resource] of data.account_types.entries()){
                        typesInputs[index].value = resource;                        
                    }
                    for(const [index, resource] of data.account_numbers.entries()){
                        numbersInputs[index].value = resource;                        
                    }
                    for(const [index, resource] of data.purposes.entries()){
                        purposesInputs[index].value = resource;                        
                    }

                }
            }

            function str2ab(str) {
                //console.log(str);
                const buf = new ArrayBuffer(str.length);
                const bufView = new Uint8Array(buf);
                for (let i=0, strLen=str.length; i < strLen; i++) {
                    bufView[i] = str.charCodeAt(i);
                }
                return buf;
            }
            
                    
            function storeInputs(){
                //const financeForm = document.getElementById('finance-form');
                const storageObj = {};
                const imgData = [];
                for(input of finForm.getElementsByClassName('form-input')){
                    storageObj[input.id] = input.value;
                }for(column of incomeTable.children){
                    const cacheArr = [];
                    for(input of column.children){
                        cacheArr.push(input.value);
                    }
                    storageObj[column.id] = cacheArr;
                }for(column of accountTable.children){
                    const cacheArr = [];
                    for(input of column.children){
                        cacheArr.push(input.value);
                    }
                    storageObj[column.id] = cacheArr;
                }if(typeof finForm.govId.files[0] !== 'undefined'){
                    console.log(finForm.govId.files[0]);                    
                    imgReader.readAsDataURL(finForm.govId.files[0]);
                }
                return {data:[storageObj], images: []};
            }
            const operations = window.crypto.subtle || window.crypto.webkitSubtle;        

            async function encryptToString(content, key){
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                console.log(content);
                

                //console.log(new Uint8Array(content[1].govId.buffer))
                //const idBuf = new ArrayBuffer()
                //idEnc.test = await decoder.decode(new Uint8Array(content.data[0].govId));
                //const idString = String.fromCharCode.apply(null, new Uint8Array(content[1].govId));                
                console.log(content.images[0]);
                console.log(JSON.stringify(content.images[0]));
                //content.data[0].govId = idEnc;                
                console.log(JSON.stringify(content));

                // input must be encoded to a buffer or TypedArray
                const contentEncoded = 
                encoder.encode(JSON.stringify(content).trim());
                console.log(content);

                //key material must be 16, 24 or 32 bytes 
                const keyEnc = encoder.encode(key.padStart(16, key).slice(0, 16));
                //console.log(keyEnc);
                console.log(contentEncoded);

                const cryptKey = await operations.importKey(
                    'raw', 
                    keyEnc,
                    { name: 'AES-GCM' },
                    true,
                    ['encrypt', 'decrypt']
                );
                
                const encryptedData = await operations.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    cryptKey,
                    contentEncoded
                );
                //const secretKey = await operations.exportKey('raw', cryptKey);                
                
                const allData = {};
                    //allData.key = new Uint8Array(secretKey),
                    allData.iv = iv,
                    //allData.content = new Uint8Array(encryptedData);
                    allData.content = String.fromCharCode.apply(null, new Uint8Array(encryptedData));
                    //allData.images = String.fromCharCode.apply(null, new Uint8Array());

                console.log(allData);
                console.log(encryptedData);
                return JSON.stringify(allData);
            }
            const imgProg = ()=>{
                    while(imgReader.readyState == 1){
                        console.log(imgReader.readyState); 
                    }return;
            }
            async function downloadFile() {
                const passkey = passkeyInput.value;
                passkeyError.hidden = true;
                if(passkey.length >= 8){
                    const link = document.createElement("a");
                    const content = await storeInputs().then(
                    imgReader.onloadend = async ()=>{
                        console.log(imgReader.result);
                        content.images[0].push(imgReader.result);
                        const encrypted = await encryptToString(content, passkey)
                        return;
                    });
                    
                    const file = new Blob([encrypted], { type: 'application/json' });
                    link.href = URL.createObjectURL(file);
                    link.download = "finance-data.json";
                    link.click();
                    URL.revokeObjectURL(link.href); 
                }else{
                    passkeyError.firstElementChild.innerHTML = 'Passkey must be 8+ characters.';
                    passkeyError.hidden = false;
                }
                
            };

            const fileReader = new FileReader();
            const fileField = document.getElementById('encrypted_file');
            const fileFieldLabel = fileField.labels[0];
            //console.log(fileField)
            //console.log(fileFieldLabel)
            fileField.addEventListener('change', function() {
                try{
                    if(passkeyInput.value.length >= 8){
                        fileReader.disabled = false;
                        passkeyError.hidden = true;
                    }
                    if(!fileField.disabled){
                        fileFieldLabel.innerHTML = fileField.files[0].name;
                        fileReader.readAsText(this.files[0]);
                        fileField.value = null;
                    }
                }catch{
                    console.log('No File');
                    fileFieldLabel.innerHTML = 'Upload Encrypted';
                }
            });
            
            fileReader.onload = async function(){  
                try{  
                    const passkey = passkeyInput.value;
                    if(passkey.length >= 8){
                        const fileJSON = JSON.parse(fileReader.result);
                        //key material must be 16, 24 or 32 bytes 
                        const keyEnc = await encoder.encode(passkey.padStart(16, passkey).slice(0, 16));
                        //console.log(fileJSON);
                        const key =  await operations.importKey('raw', keyEnc, {name: 'AES-GCM'}, true, ['encrypt', 'decrypt']);                
                        //const key = await operations.importKey('raw', new Uint8Array(Object.values(fileJSON.key)), {name: 'AES-GCM'}, true, ['encrypt', 'decrypt']);                
                        const iv = new Uint8Array(Object.values(fileJSON.iv));
                        //const encryptedData = new Uint8Array(Object.values(fileJSON.content));
                        const encryptedData = await str2ab(fileJSON.content);
                        //console.log(key);
                        //console.log(encryptedData);
                        const decryptedData = await operations.decrypt(
                        { name: 'AES-GCM', iv: iv },
                            key,
                            encryptedData
                        );
                        //console.log(decryptedData);
                        const contentDecrypted = decoder.decode(decryptedData);
                        console.log(JSON.parse(contentDecrypted));
                        listInputs(JSON.parse(contentDecrypted));
                        createTable(JSON.parse(contentDecrypted), display);
                        //display.innerHTML = contentDecrypted;
                    }else{
                        passkeyError.firstElementChild.innerHTML = 'Passkey must be 8+ characters.';
                        passkeyError.hidden = false;
                    }
                }catch{
                    passkeyError.firstElementChild.innerHTML = 'Passkey is incorrect.';
                    passkeyError.hidden = false;
                }
            }
            
            passkeyInput.addEventListener('change', ()=>{
                if(passkeyInput.value.length < 8){
                    fileFieldLabel.style.cursor = 'not-allowed';
                    fileFieldLabel.style.pointerEvents = 'none';
                }else{
                    fileFieldLabel.style.pointerEvents = 'auto';
                    fileFieldLabel.style.cursor = 'pointer';

                }
            });
            
        </script>
    </body>
</html>
