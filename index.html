<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Finances</title>
        <link async="true" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">  
        <link async="true" rel="stylesheet" href="style.css">
    </head>
    <body>

        <form id="finance-form">
            <div class="row">
                <div class="col-sm-3 labels my-auto"><label>Your Name: </label></div>
                <div class="col-sm-5 inputs">
                    <label for="first_name">First</label><br>
                    <input type="text" id="first_name" name="whole_name" class="form-input">
                    <br>
                    <label >Last</label><br>
                    <input type="text" id="last_name" name="whole_name" class="form-input">
                </div>
                <div class="col-sm-4 error-message" hidden="" id="whole_name-error"></div>
            </div>
            <div class="row">
                <div class="col-sm-3 labels"><label>University ID: </label></div>
                <div class="col-sm-5 inputs">
                    <input type="number" id="uni_id" name="uni_id" class="form-input">
                </div>
                <div class="col-sm-4 error-message" hidden="" id="uni_id-error"></div>
            </div>
            <!--
                Add input for subcategories 
                    -> Resource
                    -> Frequency
                    -> Amount
                    ?-> Use by percentage
            -->
            <div class="row">
                <div class="col-sm-3 labels"><label for="income_streams-amount">Total Income Streams:&nbsp;</label></div>
                <div class="col-sm-5 inputs">
                    <input type="number" id="income_streams-amount">
                </div>
                <div class="col-sm-4 error-message" hidden="" id="income_streams-error"></div>
            </div>
            <div class="row" hidden id="income_streams-heads">
                <div class="col-sm-3" ><h4>Resource</h4></div>
                <div class="col-sm-3" ><h4>Frequency</h4></div>
                <div class="col-sm-3" ><h4>Amount</h4></div>
                <div class="col-sm-3" ><h4>Usage(%)</h4></div>
            </div>
            <div class="row" id="income_streams">
                <div class="col-sm-3" id="resources"></div>
                <div class="col-sm-3" id="frequency"></div>
                <div class="col-sm-3" id="amounts"></div>
                <div class="col-sm-3" id="uses"></div>
            </div>
             <!--
                Add input for subcategories 
                    -> Institution
                    -> Account Type
                    ?-> Acc # (last 4)
                    ?-> Purpose
            -->
            <div class="row">
                <div class="col-sm-3 labels"><label for="financial_accounts-amount">Total Financial Accounts:&nbsp;</label></div>
                <div class="col-sm-5 inputs">
                    <input type="number" id="financial_accounts-amount">
                </div>
                <div class="col-sm-4 error-message" hidden="" id="financial_accounts-error"></div>
            </div>
            <div class="row" hidden id="financial_accounts-heads">
                <div class="col-sm-3" ><h4>Institution</h4></div>
                <div class="col-sm-3" ><h4>Type</h4></div>
                <div class="col-sm-3" ><h4>Account #</h4></div>
                <div class="col-sm-3" ><h4>Purpose</h4></div>
            </div>
            <div class="row" id="financial_accounts">
                <div class="col-sm-3" id="institution"></div>
                <div class="col-sm-3" id="account_types"></div>
                <div class="col-sm-3" id="account_numbers"></div>
                <div class="col-sm-3" id="purposes"></div>
            </div>
             <!--
                Eventually calculate actual value based on 2 weeks expenses 
                    -> Based on fixed nationwide average || Based on user's estimated weekly spending
                    ?-> By average of attended uni's local cost of living
                    ?-> Flight or roadtrip home included
            -->
            <div class="row">
                <div class="col-sm-3 labels"><label>Estimate Needed Emergency Cash: </label></div>
                <div class="col-sm-5 inputs">
                    <input type="number" step="0.01" id="emergency_cash_guess" name="emergency_cash_guess" class="form-input">
                </div>
                <div class="col-sm-4 error-message" hidden="" id="emergency_cash_guess-error"></div>
            </div>
            <!--
                Eventually savings needed to meet goal based on time until graduation 
                    -> Based on emergency cash needed, loans, future needs
                    ?-> By using attended uni's state average info && By using estimated rate of inflation
            -->
            <div class="row">
                <div class="col-sm-3 labels"><label>Estimate Needed Monthly Saving: </label></div>
                <div class="col-sm-5 inputs">
                    <input type="number" step="0.01" id="monthly_saving_guess" name="monthly_saving_guess" class="form-input">
                </div>
                <div class="col-sm-4 error-message" hidden="" id="monthly_saving_guess-error"></div>
            </div>
            <!--
                Add input for generating monthly expense report: 
                    -> Importance (1-5)
                    -> Amount
                    ?-> Date
                    ?-> Expense
            -->

            <div class="row">
                <div class="col-sm-3 labels"></div>
                <!--div class="col-sm-5"><button type="submit">Save Changes</button></div-->
                <div class="col-sm-5 inputs"><input type="button" name="save" value="Save Changes" onclick="listInputs(this.form)"/></div>
                <!--div class="col-sm-5"><input type="submit" value="Save Changes"/></div-->
                <div class="col-sm-4"></div>
            </div>
            
        </form>
        
        <form id="data-form">
            <div class="row">
                <div class="col-sm-3"><label for="text_file">Encrypted Data File: </label></div>
                <div class="col-sm-5">
                    <input type="file" accept=".json" id="text_file" name="text_file"  class="data-input">
                </div>
                <div class="col-sm-4"></div>
            </div>
            <div class="row">
                <div class="col-sm-3"><label for="passkey">Passkey: </label></div>
                <div class="col-sm-5">
                    <input type="text" id="passkey" name="passkey" class="data-input">
                </div>
                <div class="col-sm-4"></div>
            </div>
            <div class="row">
                <div class="col-sm-3"></div>
                <div class="col-sm-5"><button type="button" name="save" onclick="downloadFile()">Download</button></div>
                <div class="col-sm-4"></div>
            </div>
        </form>


        <div id="display"></div>
        <script>
            /*Using either IndexedDB or Cache api 
                ->Create storage model to save clustered datasets for later retrieval
                ->Generate:
                    Table - Expense Report, Financial Institutions, Income Streams
                    D3 Viz - Estimate Vs Actual Emergency Cash, Saving Needed to Reach Goal
            */ 
            const incomeHeads = document.getElementById('income_streams-heads');
            const incomeTable = document.getElementById('income_streams');
            const incomeAmount = document.getElementById('income_streams-amount');
            const accountHeads = document.getElementById('financial_accounts-heads');
            const accountTable = document.getElementById('financial_accounts');
            const accountAmount = document.getElementById('financial_accounts-amount');
            const divNode = document.createElement('div');
            const inputNode = document.createElement('input');
            const display = document.getElementById('display');
            
            incomeAmount.addEventListener('change', (event)=>{
                if(incomeAmount.value >= incomeTable.firstElementChild.children.length){
                    incomeRow();
                }else if(incomeAmount.value >= 0){
                    incomeRow('remove');
                }

                if(incomeTable.firstElementChild.children.length <= 0){
                    incomeHeads.hidden = true;
                }else{
                    incomeHeads.hidden = false;
                }
            });

            function incomeRow(action){
                const col = incomeTable.children[0];
                const col1 = incomeTable.children[1];
                const col2 = incomeTable.children[2];
                const col3 = incomeTable.children[3];
                if(action !== 'remove'){
                    const resource = inputNode.cloneNode(true);
                        resource.setAttribute('type', 'text');
                        resource.setAttribute('class', 'income_table-input');
                        col.appendChild(resource.cloneNode(true));
                    const frequency = resource.cloneNode(true);
                        col1.appendChild(frequency.cloneNode(true));
                    const dollar = resource.cloneNode(true);
                        dollar.setAttribute('type', 'number');
                        dollar.setAttribute('step', '0.01');
                        col2.appendChild(dollar.cloneNode(true));
                    const percentage = document.createElement('textarea');
                        percentage.setAttribute('class', 'income_table-input')
                        col3.appendChild(percentage.cloneNode(true));
                }else{
                    col.lastElementChild.remove();
                    col1.lastElementChild.remove();
                    col2.lastElementChild.remove();
                    col3.lastElementChild.remove();
                }
            }
            accountAmount.addEventListener('change', (event)=>{
                if(accountAmount.value >= accountTable.firstElementChild.children.length){
                    accountRow();
                }else if(accountAmount.value >= 0){
                    accountRow('remove');
                }
                if(accountTable.firstElementChild.children.length <= 0){
                    accountHeads.hidden = true;
                }else{
                    accountHeads.hidden = false;
                }
            });

            function accountRow(action){
                const col = accountTable.children[0];
                const col1 = accountTable.children[1];
                const col2 = accountTable.children[2];
                const col3 = accountTable.children[3];
                if(action !== 'remove'){
                    const institution = inputNode.cloneNode(true);
                        institution.setAttribute('type', 'text');
                        institution.setAttribute('class', 'account_table-input');
                        col.appendChild(institution.cloneNode(true));
                    const account_type = institution.cloneNode(true);
                        col1.appendChild(account_type.cloneNode(true));
                    const account_number = account_type.cloneNode(true);
                        account_number.setAttribute('type', 'number');
                        col2.appendChild(account_number.cloneNode(true));
                    const purpose = document.createElement('textarea');
                        purpose.setAttribute('class', 'account_table-input')
                        col3.appendChild(purpose.cloneNode(true));
                }else{
                    col.lastElementChild.remove();
                    col1.lastElementChild.remove();
                    col2.lastElementChild.remove();
                    col3.lastElementChild.remove();
                }
            }

            function listInputs(form){
                const cacheIncomeArr = [];
                const cacheAccountArr = [];
                if(form.first_name.value.length > 0 && form.last_name.value.length > 0){
                    const fullName = form.first_name.value + ' ' + form.last_name.value;
                    display.innerHTML = '<h3> Name: </h3>'+fullName;
                }
                if(form.uni_id.value.length > 0){
                    display.innerHTML += '<h3> University ID: </h3>'+form.uni_id.value;
                }
                if(!incomeHeads.hidden){
                    for(column of incomeTable.children){
                        const cacheIncomeObj = {};
                        const cacheArr = [];
                        display.innerHTML += '<h3> '+column.id+': </h3>';
                        for(input of column.children){
                            cacheIncomeObj[column.id] = input.value;
                            cacheIncomeArr.push(cacheIncomeObj);
                            cacheArr.push(input.value);
                        }
                        // display.innerHTML+=cacheIncomeArr.join(', ');
                        display.innerHTML+=cacheArr.join(', ');
                    }
                    console.log(cacheIncomeArr);
                }
                if(!incomeHeads.hidden){
                    for(column of accountTable.children){
                        const cacheAccountObj = {};
                        const cacheArr = [];
                        display.innerHTML += '<h3> '+column.id+': </h3>';
                        for(input of column.children){
                            cacheAccountObj[column.id] = input.value;
                            cacheAccountArr.push(cacheAccountObj);
                            cacheArr.push(input.value);
                        }
                        display.innerHTML+=cacheArr.join(', ');
                    }
                    console.log(cacheAccountArr);
                }
                if(form.emergency_cash_guess.value.length > 0){
                    display.innerHTML += '<h3> Estimated Emergency Cash: </h3>'+form.emergency_cash_guess.value;
                }
                if(form.monthly_saving_guess.value.length > 0){
                    display.innerHTML += '<h3> Estimated Monthly Saving: </h3>'+form.monthly_saving_guess.value;
                }
            }

            function str2ab(str) {
                console.log(str);
                const buf = new ArrayBuffer(str.length);
                const bufView = new Uint8Array(buf);
                for (let i=0, strLen=str.length; i < strLen; i++) {
                    bufView[i] = str.charCodeAt(i);
                }
                return buf;
            }
            function storeInputs(){
                const financeForm = document.getElementById('finance-form');
                const storageObj = {};
                for(input of financeForm.getElementsByClassName('form-input')){
                    storageObj[input.id] = input.value;
                }
                for(column of incomeTable.children){
                        const cacheArr = [];
                        for(input of column.children){
                            cacheArr.push(input.value);
                        }
                        storageObj[column.id] = cacheArr;
                    }
                for(column of accountTable.children){
                        const cacheArr = [];
                        for(input of column.children){
                            cacheArr.push(input.value);
                        }
                        storageObj[column.id] = cacheArr;
                    }
                //console.log(storageObj);
                return storageObj;
            }
            const operations = window.crypto.subtle || window.crypto.webkitSubtle;        

            async function encryptToString(content, key){
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                
                // input must be encoded to a buffer or TypedArray
                const encoder = new TextEncoder('utf-8');
                const contentEncoded = encoder.encode(JSON.stringify(content).trim());

                //key material must be 16, 24 or 32 bytes 
                const keyEnc = encoder.encode(key.padStart(16, key).slice(0, 16));
                //console.log(content);
                //console.log(keyEnc);
                console.log(contentEncoded);

                const cryptKey = await operations.importKey(
                    'raw', 
                    keyEnc,
                    { name: 'AES-GCM' },
                    true,
                    ['encrypt', 'decrypt']
                );
                
                const encryptedData = await operations.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    cryptKey,
                    contentEncoded
                );
                //const secretKey = await operations.exportKey('raw', cryptKey);                
                
                const allData = {};
                    //allData.key = new Uint8Array(secretKey),
                    allData.iv = iv,
                    //allData.content = new Uint8Array(encryptedData);
                    allData.content = String.fromCharCode.apply(null, new Uint8Array(encryptedData));

                console.log(allData);
                console.log(encryptedData);
                return JSON.stringify(allData);
                
            }

            async function downloadFile() {
                const passkey = document.getElementById('passkey').value;
                if(passkey.length > 8){
                    const link = document.createElement("a");
                    const content = await storeInputs();
                    const encrypted = await encryptToString(content, passkey)

                    const file = new Blob([encrypted], { type: 'application/json' });
                    link.href = URL.createObjectURL(file);
                    link.download = "finance-data.json";
                    link.click();
                    URL.revokeObjectURL(link.href); 
                }
                
            };

            const fileReader = new FileReader();
            document.getElementById('text_file').addEventListener('change', function() {
                fileReader.readAsText(this.files[0]);
            });
            fileReader.onload = async function(){    
                    const passkey = document.getElementById('passkey').value;
                    const fileJSON = JSON.parse(fileReader.result);
                    const encoder = new TextEncoder('utf-8');
                    //key material must be 16, 24 or 32 bytes 
                    const keyEnc = await encoder.encode(passkey.padStart(16, passkey).slice(0, 16));
                    console.log(fileJSON);
                        const key =  await operations.importKey('raw', keyEnc, {name: 'AES-GCM'}, true, ['encrypt', 'decrypt']);                
                        //const key = await operations.importKey('raw', new Uint8Array(Object.values(fileJSON.key)), {name: 'AES-GCM'}, true, ['encrypt', 'decrypt']);                
                        const iv = new Uint8Array(Object.values(fileJSON.iv));
                        //const encryptedData = new Uint8Array(Object.values(fileJSON.content));
                        const encryptedData = await str2ab(fileJSON.content);
                    console.log(key);
                    console.log(encryptedData);

                    const decryptedData = await operations.decrypt(
                    { name: 'AES-GCM', iv: iv },
                        key,
                        encryptedData
                    );
                    console.log(decryptedData);
                    const decoder = new TextDecoder();
                    const contentDecrypted = decoder.decode(decryptedData);
                    console.log(contentDecrypted);
                    display.innerHTML = contentDecrypted;
            }
            
            
        </script>
    </body>
</html>
